[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "uav-debugger"
version = "0.1.0.dev0"
description = "Offline UAV recording inspection with explicit source and time provenance"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pymavlink==2.4.49"]

[project.scripts]
uav-debugger = "uav_debugger.__main__:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/uav_debugger"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/uav_debugger/*.py",
    "/tests/test_*.py",
    "/tests/fixtures/*",
    "/scripts/generate_fixture.py",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
    "/.python-version",
    "/.gitignore",
    "/docs/project-scope.md",
    "/docs/workflows.md",
    "/docs/architecture.md",
    "/docs/first-milestone.md",
    "/docs/importer.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
